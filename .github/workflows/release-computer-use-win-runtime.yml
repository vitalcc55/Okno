name: release-computer-use-win-distribution

on:
  workflow_dispatch:
    inputs:
      version:
        description: Runtime release version without leading v
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write
  attestations: write
  id-token: write

jobs:
  build-release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Resolve release version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $version = "${{ inputs.version }}"
          }
          else {
            $version = "${{ github.ref_name }}".TrimStart('v')
          }

          if ([string]::IsNullOrWhiteSpace($version)) {
            throw "Release version is empty."
          }

          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "tag=v$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Package runtime release asset
        id: package_runtime
        shell: pwsh
        run: |
          $releaseBaseUrl = "https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.tag }}/"
          $payload = powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/codex/package-computer-use-win-runtime-release.ps1 -Version "${{ steps.version.outputs.version }}" -Rid "win-x64" -RuntimeDownloadBaseUrl $releaseBaseUrl
          $json = $payload | ConvertFrom-Json
          "archive_path=$($json.archivePath)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "checksum_path=$($json.checksumPath)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "asset_name=$($json.assetName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "descriptor_path=$($json.descriptorPath)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "result_path=$($json.resultPath)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Package plugin release asset
        id: package_plugin
        shell: pwsh
        run: |
          $payload = powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/codex/package-computer-use-win-plugin-release.ps1 -Version "${{ steps.version.outputs.version }}" -RuntimePackagingResultPath "${{ steps.package_runtime.outputs.result_path }}"
          $json = $payload | ConvertFrom-Json
          "archive_path=$($json.archivePath)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "checksum_path=$($json.checksumPath)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "asset_name=$($json.assetName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Package setup CLI payload asset
        id: package_setup_payload
        shell: pwsh
        run: |
          $payload = powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/codex/package-computer-use-win-setup-cli-payload.ps1 -Version "${{ steps.version.outputs.version }}" -Rid "win-x64" -RuntimePackagingResultPath "${{ steps.package_runtime.outputs.result_path }}"
          $json = $payload | ConvertFrom-Json
          "archive_path=$($json.archivePath)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "checksum_path=$($json.checksumPath)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "asset_name=$($json.assetName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Package WinUI setup app asset
        id: package_setup_app
        shell: pwsh
        run: |
          $payload = powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/codex/package-okno-setup-app-release.ps1 -Version "${{ steps.version.outputs.version }}" -Rid "win-x64" -RuntimePackagingResultPath "${{ steps.package_runtime.outputs.result_path }}"
          $json = $payload | ConvertFrom-Json
          "archive_path=$($json.archivePath)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "checksum_path=$($json.checksumPath)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "asset_name=$($json.assetName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          if (-not (gh release view $tag 2>$null)) {
            gh release create $tag --draft --title "Okno Computer Use for Windows $tag" --notes "Draft distribution release for Computer Use for Windows." --target "${{ github.sha }}"
          }

      - name: Upload release assets to draft
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          gh release upload $tag "${{ steps.package_runtime.outputs.archive_path }}" "${{ steps.package_runtime.outputs.checksum_path }}" "${{ steps.package_plugin.outputs.archive_path }}" "${{ steps.package_plugin.outputs.checksum_path }}" "${{ steps.package_setup_payload.outputs.archive_path }}" "${{ steps.package_setup_payload.outputs.checksum_path }}" "${{ steps.package_setup_app.outputs.archive_path }}" "${{ steps.package_setup_app.outputs.checksum_path }}" "scripts/codex/install-computer-use-win.ps1" --clobber

      - name: Attest runtime archive
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ steps.package_runtime.outputs.archive_path }}

      - name: Attest plugin archive
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ steps.package_plugin.outputs.archive_path }}

      - name: Attest setup CLI payload archive
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ steps.package_setup_payload.outputs.archive_path }}

      - name: Attest setup app archive
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ steps.package_setup_app.outputs.archive_path }}

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release edit "${{ steps.version.outputs.tag }}" --draft=false --latest
